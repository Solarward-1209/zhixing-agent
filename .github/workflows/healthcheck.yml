name: Healthcheck

# 在线演示是可选加分项，但"评审期间服务可用"是硬要求。
# 该工作流每 10 分钟探活一次：
#   1. 让免费档实例保持唤醒状态（Render/Railway 免费档长时间无访问会休眠）；
#   2. 服务异常时在 Actions 里留下红色记录，便于及时发现。
# 可通过仓库变量 DEMO_URL 覆盖默认地址（Settings → Variables）。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="${{ vars.DEMO_URL || 'https://zhixing-agent-production.up.railway.app' }}"
          echo "healthcheck target: $URL/api/health"
          for i in 1 2 3; do
            if body=$(curl -fsS --max-time 20 "$URL/api/health"); then
              echo "response: $body"
              if echo "$body" | grep -q '"mode"'; then
                echo "OK"
                exit 0
              fi
            fi
            echo "attempt $i failed, retrying..."
            sleep 15
          done
          echo "::error::在线演示地址健康检查失败，请检查部署平台状态与额度"
          exit 1
